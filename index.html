<script>

}

renderSchematicList(filtered.filter(c=>c.type==='schematic'));

document.getElementById('schematicView').classList.remove('hidden');
document.getElementById('schematicView').querySelector('#schematicList').innerHTML='';
filtered.filter(c=>c.type==='schematic').forEach(c=>{
document.getElementById('schematicList').innerHTML+=`<div class="schematic-card"><b>${c.part}</b><br><small>${c.compat}</small></div>`;
});
}
}
