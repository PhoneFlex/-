<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فون فلكس Phone Flex</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0f0f0f;color:#fff}
header{background:linear-gradient(90deg,#667eea,#764ba2);padding:20px;text-align:center}
.container{padding:12px;max-width:1200px;margin:auto}
.hidden{display:none!important}
.search-box{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;margin:15px 0;font-size:16px}
.section-title{color:#667eea;font-size:18px;margin:20px 0 12px;border-right:4px solid #667eea;padding-right:10px}
.back-btn{background:#222;border:1px solid #444;color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>فون فلكس Phone Flex</h1><p>البصرة - العشار - موسوعة التوافقات</p></header>
<div class="container">
<input type="text" id="search" class="search-box" placeholder="ابحث: A12 , شاشة , بطارية , قاعدة..." oninput="doSearch()">
<div id="homeView"></div>
<div id="listView" class="hidden"><button class="back-btn" onclick="goHome()">← رجوع</button><h2 id="viewTitle" class="section-title"></h2><div id="viewGrid"></div></div>
<style>
/* هذا الترتيب الي طلبته بالضبط */
.cats-wrapper{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.cat-card{background:linear-gradient(135deg,#1e1e2e,#2a2a4a);border-radius:16px;padding:20px;text-align:center;cursor:pointer;border:1px solid #333;transition:0.2s;min-height:110px;display:flex;flex-direction:column;justify-content:center}
.cat-card:hover{transform:translateY(-4px);border-color:#667eea}
.cat-card .icon{font-size:36px} .cat-card h3{font-size:14px;margin-top:6px} .cat-card small{color:#aaa;font-size:11px}
.brands-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.brand-card{background:#1a1a1a;border-radius:14px;padding:12px;text-align:center;cursor:pointer;border:1px solid #2a2a2a}
.brand-card img{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}
.phones-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.phone-card{background:#1a1a1a;border-radius:10px;padding:8px;text-align:center;border:1px solid #222}
.phone-card img{width:100%;height:140px;object-fit:contain;background:#111;border-radius:6px}
.compat-tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.compat-tabs button{background:#222;border:1px solid #444;color:#aaa;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
.compat-tabs button.active{background:#667eea;color:#fff}
.compat-card{background:#1e1e1e;border-radius:10px;padding:10px;margin:8px 0;border-right:4px solid #ffa500;font-size:13px}
.compat-card.screen{border-color:#4ade80} .compat-card.battery{border-color:#f87171} .compat-card.charge{border-color:#60a5fa}
</style>
<div id="compatView" class="hidden">
<button class="back-btn" onclick="goHome()">← رجوع</button>
<h2 class="section-title">🔧 توافقات الاجهزة</h2>
<div class="compat-tabs">
<button class="active" id="btnAll" onclick="filterCompat('all')">الكل</button>
<button onclick="filterCompat('screen')">📱 الشاشات</button>
<button onclick="filterCompat('battery')">🔋 البطاريات</button>
<button onclick="filterCompat('charge')">🔌 قواعد الشحن</button>
</div>
<div id="compatList"></div>
</div>
<div id="lessonsView" class="hidden"><button class="back-btn" onclick="goHome()">← رجوع</button><h2 class="section-title">🎓 دورات اون لاين</h2><video controls style="width:100%;border-radius:12px;background:#000"><source src="ad.mp4" type="video/mp4"></video></div>
</div>

 const batteriesDB = [

 const chargeDB = [
{part:"قاعدة شحن A02s / A02 / A03s",compat:"A02s , A02 , A03s , M02s - Type-C",type:"charge"},
{part:"قاعدة شحن A12 / M12",compat:"A12 , M12 , F12 - Type-C",type:"charge"},
{part:"قاعدة شحن A13 / M13",compat:"A13 , M13 , F13 - Type-C",type:"charge"},

{part:"قاعدة شحن انفينكس Hot 10 / Hot 11 / Hot 12",compat:"Hot 10 , Hot 11 , Hot 12 - Type-C",type:"charge"},
{part:"قاعدة شحن انفينكس Hot 30 / Hot 40 / Note 30",compat:"Hot 30 , Hot 40 , Note 30 - Type-C 33W",type:"charge"},

{part:"قاعدة شحن ايفون 7 / 8 / SE / X / 11",compat:"iPhone 7 , 8 , SE , X , 11 , XR - Lightning",type:"charge"},
];
const allCompat = [...screensDB, ...screensDB2, ...batteriesDB, ...chargeDB];
 function renderHome(){
let home=document.getElementById('homeView');
home.innerHTML=`
<h2 class="section-title">📚 الاقسام الرئيسية</h2>
<div class="cats-wrapper">
  <div class="cat-card" onclick="openCat('lessons')"><div class="icon">🎓</div><h3>دورات اون لاين</h3><small>تعلم الصيانة</small></div>
  <div class="cat-card" style="background:linear-gradient(135deg,#2e2a1a,#3d3311)" onclick="openCat('compat')"><div class="icon">🔧</div><h3>توافقات الاجهزة</h3><small>${allCompat.length} توافق</small></div>
  <div class="cat-card" style="background:linear-gradient(135deg,#1a2e1a,#162e1a)" onclick="openCat('accessories')"><div class="icon">🎧</div><h3>اكسسوارات</h3><small>كفرات وشواحن</small></div>
  <div class="cat-card" style="background:linear-gradient(135deg,#2e1a2e,#3e1a2e)" onclick="openCat('devices')"><div class="icon">📱</div><h3>اجهزة</h3><small>كل الهواتف</small></div>
</div>
<h2 class="section-title">🏢 شركات الهواتف</h2>
<div class="brands-grid" id="brandsGrid"></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:15px">
<div style="background:#1a2e1a;padding:12px;border-radius:10px;text-align:center"><b style="color:#4ade80;font-size:18px" id="countScreen"></b><br><small>شاشة</small></div>
<div style="background:#2e1a1a;padding:12px;border-radius:10px;text-align:center"><b style="color:#f87171;font-size:18px" id="countBattery"></b><br><small>بطارية</small></div>
<div style="background:#1a1e2e;padding:12px;border-radius:10px;text-align:center"><b style="color:#60a5fa;font-size:18px" id="countCharge"></b><br><small>قاعدة</small></div>
</div>
`;
let bGrid=document.getElementById('brandsGrid');
for(let k in brandsInfo){bGrid.innerHTML+=`<div class="brand-card" onclick="openBrand('${k}')"><img src="${brandsInfo[k].logo}"><h3>${brandsInfo[k].name}</h3></div>`;}
document.getElementById('countScreen').innerText = screensDB.length+screensDB2.length;
document.getElementById('countBattery').innerText = batteriesDB.length;
document.getElementById('countCharge').innerText = chargeDB.length;
renderCompatList(allCompat);
 }
 function renderCompatList(list){
let div=document.getElementById('compatList'); div.innerHTML='';
if(list.length===0){div.innerHTML='<p style="text-align:center;color:#777;padding:20px">ماكو نتيجة لـ A12 جرب كلمة ثانية</p>'; return;}
list.forEach(c=>{
let icon=c.type==='screen'?'📱':c.type==='battery'?'🔋':'🔌';
let cls=c.type;
div.innerHTML+=`<div class="compat-card ${cls}"><b>${icon} ${c.part}</b><br><small>✅ ${c.compat}</small></div>`;
});
}
function filterCompat(type){
document.querySelectorAll('.compat-tabs button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
let filtered=type==='all'?allCompat:allCompat.filter(c=>c.type===type);
renderCompatList(filtered);
}
function openBrand(key){
document.getElementById('homeView').classList.add('hidden');
document.getElementById('listView').classList.remove('hidden');
document.getElementById('viewTitle').innerText=brandsInfo[key].name;
let grid=document.getElementById('viewGrid'); grid.innerHTML='';
(phonesDB[key]||[]).forEach(p=>{grid.innerHTML+=`<div class="phone-card"><img src="${p.img}"><h4>${p.name}</h4><div class="price">${p.price}</div></div>`;});
}
function openCat(id){
document.getElementById('homeView').classList.add('hidden');
if(id==='devices'){document.getElementById('listView').classList.remove('hidden');document.getElementById('viewTitle').innerText='كل الاجهزة';let g=document.getElementById('viewGrid');g.innerHTML='';for(let k in phonesDB){phonesDB[k].forEach(p=>{g.innerHTML+=`<div class="phone-card" data-name="${p.name}"><img src="${p.img}"><h4>${p.name}</h4><div class="price">${p.price}</div></div>`;});}}
else if(id==='accessories'){document.getElementById('listView').classList.remove('hidden');document.getElementById('viewTitle').innerText='الاكسسوارات';let g=document.getElementById('viewGrid');g.innerHTML='';accessoriesDB.forEach(p=>{g.innerHTML+=`<div class="phone-card"><img src="${p.img}"><h4>${p.name}</h4><div class="price">${p.price}</div></div>`;});}
else if(id==='compat'){document.getElementById('compatView').classList.remove('hidden');renderCompatList(allCompat);}
else if(id==='lessons'){document.getElementById('lessonsView').classList.remove('hidden');}
}
function goHome(){
['listView','compatView','lessonsView'].forEach(i=>{document.getElementById(i).classList.add('hidden');});
document.getElementById('homeView').classList.remove('hidden');
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase().trim();
if(q.length<1){renderCompatList(allCompat);return;}
let filtered=allCompat.filter(c=>c.part.toLowerCase().includes(q)||c.compat.toLowerCase().includes(q));
if(document.getElementById('homeView').classList.contains('hidden')==false){
document.getElementById('homeView').classList.add('hidden');
document.getElementById('compatView').classList.remove('hidden');
}
renderCompatList(filtered);
}
renderHome();
</script>
<footer style="text-align:center;padding:20px;background:#000;margin-top:20px;border-top:1px solid #222">
<p id="footerText"></p>
<p style="font-size:11px;color:#666;margin-top:5px">شاشات وبطاريات وقواعد شحن - كل الاجهزة</p>
</footer>
<script>
// هذا يصلح مشكلة ${} الي شفتها بالصورة
document.getElementById('footerText').innerText = '© 2026 فون فلكس Phone Flex - موسوعة التوافقات - ' + allCompat.length + ' توافق';
</script>
</body>
</html>
