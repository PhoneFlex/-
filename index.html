async function fbLoadLogs(){

function addLog(icon,title,detail,opts){
  opts=opts||{};

  pfLogs.unshift(entry);pfLogs=pfLogs.slice(0,300);saveLogs();fbSaveLogEntry(entry);
  if(typeof renderLogs==='function'){try{renderLogs();}catch(e){}}

}

function calcSubEnd(start,days){return Number(start)+Number(days)*86400000;}
function daysLeft(u){if(!u||u.role==='admin')return 9999;if(u.subActive===false)return 0;if(!u.subEnd){if(u.subStart&&u.subDays)return Math.max(0,Math.ceil((calcSubEnd(u.subStart,u.subDays)-Date.now())/86400000));return SUB_DAYS_DEFAULT;}return Math.max(0,Math.ceil((Number(u.subEnd)-Date.now())/86400000));}

function fmtDateTime(ts){try{let d=new Date(Number(ts||Date.now()));return d.toLocaleDateString('ar-IQ')+' - '+d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});}catch(e){return '---';}}

function buildAccountMsg(u){let now=fmtDateTime(Date.now());let shop=shopNameOf(u);let total=u.subDays||SUB_DAYS_DEFAULT;return '⭕ '+shop+' ⭕\n'+'✦ ━━━━━━━━━━━ ✦\n'+'📱 فون فلكس - '+shop+'\n'+'✦ ━━━━━━━━━━━ ✦\n'+'هلا '+u.name+' 👋\n'+'حسابك جاهز ✅\n\n'+'👤 الاسم: '+u.name+'\n'+'🆔 المعرف: '+u.user+'\n'+'🔑 كلمة السر: '+u.pass+'\n'+'📅 الاشتراك: '+total+' يوم\n'+'🗓️ يبدأ: '+fmtDate(u.subStart)+'\n'+'⏳ ينتهي: '+fmtDate(u.subEnd)+'\n\n'+'🏪 الصيانة: '+shop+'\n'+'📞 رقم الصيانة: '+shopPhoneOf(u)+'\n'+'📍 العنوان: '+shopAddressOf(u)+'\n\n'+'🕒 تاريخ الارسال: '+now+'\n'+'━━━━━━━━━━━\n'+DISCLAIMER_TEXT;}
function cleanWaNumber(raw){if(!raw)return '';let n=String(raw).replace(/[^0-9]/g,'');if(n.startsWith('00964')) n=n.slice(5);else if(n.startsWith('964') && n.length>=12) n=n.slice(3);else if(n.startsWith('0')) n=n.slice(1);if(n.startsWith('964')) return n;if(n.length===10 && n.startsWith('7')) return '964'+n;if(n.length===11 && n.startsWith('07')) return '964'+n.slice(1);return '964'+n;}

function buildRepairMsg(r,statusText,footer){let shop=currentUser?shopNameOf(currentUser):'صيانة سيد عباس';let addr=currentUser?shopAddressOf(currentUser):'البصرة - العشار';let shopPhone=currentUser?shopPhoneOf(currentUser):'07738105665';let when=fmtDateTime(r.createdAt||Date.now());return '⭕ '+shop+' ⭕\n'+'✦ ━━━━━━━━━━━ ✦\n'+'📱 فون فلكس - '+shop+'\n'+'✦ ━━━━━━━━━━━ ✦\n'+'هلا '+r.customer+' 👋\n'+'📞 رقمك: '+r.phone+'\n'+'📱 نوع الجهاز: '+r.device+'\n'+'🔧 العطل: '+r.fault+'\n'+'💰 السعر: '+(r.price||0)+' دينار\n'+'📊 الحالة: '+statusText+'\n'+'🕒 الوقت: '+fmtTimeOnly(r.createdAt||Date.now())+'\n'+'📅 التاريخ: '+fmtDate(r.createdAt||Date.now())+'\n'+'\n'+footer+'\n'+'\n🏪 '+shop+'\n'+'📞 '+shopPhone+'\n'+'📍 '+addr+'\n'+'🕒 ارسلت: '+when+'\n'+'━━━━━━━━━━━\n'+DISCLAIMER_TEXT;}
function sendRepairWhatsApp(idx,type){let r=repairs[idx];if(!r)return;let msg='';if(type==='received'){msg=buildRepairMsg(r,'تم استلام جهازك','تم استلام جهازك للصيانة 🛠️\nمن يكمل نتصل بيك 🙏');}else if(type==='inprogress'){msg=buildRepairMsg(r,'قيد الصيانة','جهازك قيد الصيانة 🛠️\nدنشــتغل عليه وان شاء الله يكمل قريب 🙏');}else if(type==='done'){msg=buildRepairMsg(r,'كمل جهازك تكدر تجي تستلمه','كمل جهازك ✅\nتكدر تجي تستلمه 🙏');}else if(type==='unpaid'){msg=buildRepairMsg(r,'لم تقم بدفع الاجور','جهازك كمل ✅\nبس لم تقم بدفع الاجور 💰\nتكدر تجي تستلمه بعد دفع الاجور 🙏');}openWhatsApp(r.phone,msg);}
function buildInvoiceHTML(r){let shop=currentUser?shopNameOf(currentUser):'صيانة سيد عباس';let addr=currentUser?shopAddressOf(currentUser):'البصرة - العشار';let shopPhone=currentUser?shopPhoneOf(currentUser):'07738105665';let when=r.createdAt||Date.now();let invNo='PF-'+String(when).slice(-6);return '<div style="direction:rtl;font-family:Arial;text-align:right;color:#000;padding:20px;max-width:600px;margin:auto;border:2px solid #000">'+'<div style="text-align:center"><div style="font-size:28px">📱</div><h2 style="margin:5px 0">فون فلكس - '+shop+'</h2><p style="margin:0">📞 '+shopPhone+' | 📍 '+addr+'</p><hr></div>'+'<h3 style="text-align:center">🧾 فاتورة صيانة - رقم: '+invNo+'</h3>'+'<table style="width:100%;border-collapse:collapse;font-size:15px;line-height:2"><tr><td><b>👤 اسم الزبون:</b></td><td>'+r.customer+'</td></tr><tr><td><b>📞 رقم الزبون:</b></td><td dir="ltr" style="text-align:right">'+r.phone+'</td></tr><tr><td><b>📱 نوع الجهاز:</b></td><td>'+r.device+'</td></tr><tr><td><b>🔧 العطل:</b></td><td>'+r.fault+'</td></tr><tr><td><b>⚙️ يعمل او لا:</b></td><td>'+(r.works||'---')+'</td></tr><tr><td><b>📊 الحالة:</b></td><td>'+r.status+'</td></tr><tr><td><b>🕒 الوقت:</b></td><td>'+fmtTimeOnly(when)+'</td></tr><tr><td><b>📅 التاريخ:</b></td><td>'+fmtDate(when)+'</td></tr></table>'+'<div style="border:2px dashed #000;padding:12px;text-align:center;margin:15px 0"><span style="font-size:18px">💰 السعر الكلي: <b style="font-size:22px">'+(r.price||0).toLocaleString()+' دينار</b></span></div>'+'<div style="background:#f5f5f5;padding:10px;text-align:center;font-size:13px;border:1px solid #000">'+DISCLAIMER_TEXT+'</div>'+'<div style="display:flex;justify-content:space-between;margin-top:30px"><span>توقيع الزبون: ................</span><span>توقيع المحل: ................</span></div>'+'<p style="text-align:center;font-size:11px;color:#666;margin-top:15px">شكرا لثقتكم بنا - فون فلكس © 2026</p></div>';}

if(db){
  try{db.collection("repairs").orderBy("createdAt","desc").onSnapshot((snap)=>{repairs=[];snap.forEach(doc=>{let d=doc.data();d.id=doc.id;d._docId=doc.id;repairs.push(d);});if(typeof renderRepairs==='function'&&currentUser&&isAdmin())renderRepairs();});}catch(e){console.log(e);}
  try{db.collection("users").onSnapshot((snap)=>{cloudUsers=[];snap.forEach(doc=>{let d=doc.data();d._docId=doc.id;cloudUsers.push(d);});});}catch(e){console.log(e);}
  try{db.collection("settings").doc("main").onSnapshot((doc)=>{if(doc.exists&&doc.data().settings){appSettings=doc.data().settings;localStorage.setItem('pf_settings',JSON.stringify(appSettings));applySettings();}});}catch(e){}
  try{db.collection("logs").orderBy("time","desc").limit(200).onSnapshot(function(snap){let all=[];snap.forEach(function(doc){let d=doc.data();d._docId=doc.id;all.push(d);});if(!currentUser){pfLogs=all;return;}if(isAdmin()){pfLogs=all;}else{pfLogs=all.filter(function(l){return l.isGlobal||l.owner===currentUser.user||l.targetUser===currentUser.user||l.owner==='all';});}saveLogs();if(typeof renderLogs==='function'){try{renderLogs();}catch(e){}}if(typeof renderUserLogs==='function'){try{renderUserLogs();}catch(e){}}});}catch(e){console.log(e);}

async function syncUsersFromCloud(){if(!db){alert("الفايربيس ما اتصل - افتح النت وحدث الصفحة");return [];}try{let snap=await db.collection("users").get();cloudUsers=[];snap.forEach(doc=>{let d=doc.data();d._docId=doc.id;cloudUsers.push(d);});return cloudUsers;}catch(e){alert("مشكلة بالفايربيس: "+e.message);return [];}}

function isAdmin(){return currentUser&&currentUser.role==="admin";}
function requireAdmin(){if(!isAdmin()){alert("⛔ هذا الخيار للمطور فقط");return false;}return true;}
function checkLogin(){
  try{
    let saved=localStorage.getItem('pf_session');
    if(saved){
      let s=JSON.parse(saved);
      if(s&&s.user&&s.pass){
        if(s.user==="admin"&&checkDevPass(s.pass)){currentUser=s;showApp();fbLoadSettings().then(function(){applySettings();});fbLoadCompat();fbLoadLogs();return;}

        if(db){syncUsersFromCloud().then(function(){let fresh=getUsers().find(function(x){return x.user===s.user;});if(!fresh){localStorage.removeItem('pf_session');currentUser=null;showLogin();alert("تم حذف حسابك");return;}if(String(fresh.pass)!==String(s.pass)){localStorage.removeItem('pf_session');currentUser=null;showLogin();return;}if(fresh.role!=='admin'&&isSubExpired(fresh)){localStorage.removeItem('pf_session');currentUser=null;showLogin();alert("⏳ اشتراكك خلص ❌\nتواصل ويا سيد عباس حتى يجددلك");return;}currentUser=fresh;localStorage.setItem('pf_session',JSON.stringify(fresh));renderSubBar();}).catch(function(){});}
        return;
      }
    }

function sendAccountWhatsApp(user){
  let u=getUsers().find(function(x){return x.user===user;});if(!u)return;
  openWhatsApp(u.phone, buildAccountMsg(u));
}
function adminCopyUser(user){let u=getUsers().find(function(x){return x.user===user;});if(!u)return;let txt=buildAccountMsg(u);if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){alert('تم النسخ ✅ - بيها اسم الصيانة والتاريخ والوقت');});else alert(txt);}
async function adminExtendUser(user){
  let u=getUsers().find(function(x){return x.user===user;});
  if(!u)return;
  let daysStr=prompt('كم يوم تريد تجدد لـ '+u.name+' ؟\nاكتب بكيفيك - مثال: 30 او 60 او 100 او 365\nالمدة الحالية: '+(u.subDays||100)+' يوم','100');
  if(daysStr===null)return;
  let days=parseInt(daysStr);
  if(!days||days<1||days>3650){alert('اكتب عدد ايام صحيح من 1 الى 3650');return;}
  if(!confirm('تجدد لـ '+u.name+' '+days+' يوم؟\n🏪 '+shopNameOf(u)))return;
  let now=Date.now();
  let stillActive = u.subActive!==false && Number(u.subEnd||0) > now;
  let base = stillActive ? Number(u.subEnd) : now;
  if(!stillActive) u.subStart = now;
  u.subEnd = base + days*86400000;
  u.subDays = days;
  u.subActive = true;
  try{await fbSaveUser(u);addLog('🔄','تم تجديد اشتراك','👤 '+u.name+' - @'+u.user+' - 📅 '+days+' يوم - ينتهي: '+fmtDate(u.subEnd),{owner:u.user,targetUser:u.user});alert('✅ تم التجديد '+days+' يوم\n🏪 '+shopNameOf(u)+'\nينتهي: '+new Date(u.subEnd).toLocaleDateString('ar-IQ')+'\n🕒 '+fmtDateTime(Date.now()));}catch(e){alert(e.message);}
  renderAdminUsers();
}
async function adminToggleUser(user){let u=getUsers().find(function(x){return x.user===user;});if(!u)return;u.subActive=!u.subActive;try{await fbSaveUser(u);}catch(e){}addLog(u.subActive?'▶️':'⏸️',u.subActive?'تم تشغيل حساب':'تم ايقاف حساب','👤 '+u.name+' - @'+u.user,{owner:u.user,targetUser:u.user});renderAdminUsers();}
async function adminDeleteUser(user){if(!confirm('تحذف '+user+' ؟'))return;let u=getUsers().find(function(x){return x.user===user;});if(u)await fbDeleteUser(u);await syncUsersFromCloud();addLog('🗑️','انحذف حساب','👤 '+(u?u.name:user)+' - @'+user,{owner:user,targetUser:user});renderAdminUsers();}

function startUnlock(){if(unlockTimer)return;unlockPct=0;let log=document.getElementById('unlockLog');log.innerHTML='<div class="info">▶ بدء: '+unlockOp+' - '+unlockModelName+'</div>';let steps=['جاري الاتصال بالجهاز...','قراءة معلومات الجهاز...','جاري فك القفل...','جاري التحقق...','تم بنجاح ✅'];let si=0;unlockTimer=setInterval(function(){unlockPct=Math.min(100,unlockPct+10);document.getElementById('unlockProgress').style.width=unlockPct+'%';document.getElementById('unlockPercent').innerText=unlockPct+'%';document.getElementById('unlockStatus').innerText=steps[Math.min(si,steps.length-1)];if(unlockPct%30===0&&si<steps.length){log.innerHTML+='<div class="ok">✅ '+steps[si]+'</div>';si++;}if(unlockPct>=100){clearInterval(unlockTimer);unlockTimer=null;log.innerHTML+='<div class="ok">🎉 تمت العملية بنجاح!</div>';}},400);}

  let data=borneoData[borneoModel]||borneoData["Samsung A12"];
