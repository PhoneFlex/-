{part:"قاعدة شحن ريلمي C11 / C12 / C15",compat:"C11 , C12 , C15 , C25 - Micro USB",type:"charge"},
{part:"قاعدة شحن ريلمي C21 / C25Y",compat:"C21 , C21Y , C25Y - Micro USB",type:"charge"},
{part:"قاعدة شحن ريلمي C33 / C35 / C51",compat:"C33 , C35 , C51 , C53 - Type-C",type:"charge"},
{part:"قاعدة شحن ايفون 7 / 8 / SE",compat:"iPhone 7 , 8 , SE 2020 , SE 2022 - Lightning نفس القاعدة",type:"charge"},
];
 <script>
const allCompat = [...screensDB, ...screensDB2, ...batteriesDB, ...batteriesDB2, ...chargeDB];
let currentFilter = 'all';

function renderHome(){
let home=document.getElementById('homeView');
home.innerHTML=`
<h2 class="section-title">📚 الاقسام الرئيسية</h2>
<div class="cats-wrapper">
<div class="cat-card" onclick="openCat('lessons')"><div class="icon">🎓</div><h3>دورات اون لاين</h3></div>
<div class="cat-card" style="background:linear-gradient(135deg,#2e2a1a,#3d3311)" onclick="openCat('compat')"><div class="icon">🔧</div><h3>توافقات الاجهزة</h3><small>${allCompat.length} توافق</small></div>
<div class="cat-card" style="background:linear-gradient(135deg,#1a2e1a,#162e1a)" onclick="openCat('accessories')"><div class="icon">🎧</div><h3>اكسسوارات</h3></div>
<div class="cat-card" style="background:linear-gradient(135deg,#2e1a2e,#3e1a2e)" onclick="openCat('devices')"><div class="icon">📱</div><h3>اجهزة</h3></div>
</div>
<h2 class="section-title">🏢 شركات الهواتف</h2>
<div class="brands-grid" id="brandsGrid"></div>
<h2 class="section-title" style="margin-top:20px">🔥 احصائيات التوافقات</h2>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<div style="background:#1a2e1a;padding:12px;border-radius:10px;text-align:center"><b style="color:#4ade80;font-size:20px">${screensDB.length+screensDB2.length}</b><br><small>شاشة</small></div>
<div style="background:#2e1a1a;padding:12px;border-radius:10px;text-align:center"><b style="color:#f87171;font-size:20px">${batteriesDB.length+batteriesDB2.length}</b><br><small>بطارية</small></div>
<div style="background:#1a1e2e;padding:12px;border-radius:10px;text-align:center"><b style="color:#60a5fa;font-size:20px">${chargeDB.length}</b><br><small>قاعدة شحن</small></div>
</div>
`;
let bGrid=document.getElementById('brandsGrid');
for(let k in brandsInfo){let b=brandsInfo[k]; bGrid.innerHTML+=`<div class="brand-card" onclick="openBrand('${k}')"><img src="${b.logo}" onerror="this.src='https://via.placeholder.com/60'"><h3>${b.name}</h3></div>`;}
renderCompatList(allCompat);
 }
 function renderCompatList(list){
let div=document.getElementById('compatList'); div.innerHTML='';
if(list.length===0){div.innerHTML='<p style="text-align:center;color:#777;margin-top:20px">ماكو نتيجة</p>';return;}
list.forEach(c=>{
let cls=c.type; let icon=c.type==='screen'?'📱':c.type==='battery'?'🔋':'🔌';
div.innerHTML+=`<div class="compat-card ${cls}"><b>${icon} ${c.part}</b><br><small>✅ ${c.compat}</small></div>`;
});
}
function filterCompat(type,btn){
currentFilter=type;
document.querySelectorAll('.compat-tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
let filtered=type==='all'?allCompat:allCompat.filter(c=>c.type===type);
renderCompatList(filtered);
}
function openBrand(key){
document.getElementById('homeView').classList.add('hidden');
document.getElementById('listView').classList.remove('hidden');
document.getElementById('viewTitle').innerText=brandsInfo[key].name;
let grid=document.getElementById('viewGrid'); grid.innerHTML='';
(phonesDB[key]||[]).forEach(p=>{grid.innerHTML+=`<div class="phone-card"><img src="${p.img}"><h4>${p.name}</h4><div class="price">${p.price}</div></div>`;});
}
function openCat(id){
document.getElementById('homeView').classList.add('hidden');
if(id==='devices'){document.getElementById('listView').classList.remove('hidden');document.getElementById('viewTitle').innerText='كل الاجهزة';let grid=document.getElementById('viewGrid');grid.innerHTML='';for(let k in phonesDB){phonesDB[k].forEach(p=>{grid.innerHTML+=`<div class="phone-card" data-name="${p.name.toLowerCase()}"><img src="${p.img}"><h4>${p.name}</h4><div class="price">${p.price}</div></div>`;});}}
else if(id==='accessories'){document.getElementById('listView').classList.remove('hidden');document.getElementById('viewTitle').innerText='الاكسسوارات';let grid=document.getElementById('viewGrid');grid.innerHTML='';accessoriesDB.forEach(p=>{grid.innerHTML+=`<div class="phone-card"><img src="${p.img}"><h4>${p.name}</h4><div class="price">${p.price}</div></div>`;});}
else if(id==='compat'){document.getElementById('compatView').classList.remove('hidden');renderCompatList(allCompat);}
else if(id==='lessons'){document.getElementById('lessonsView').classList.remove('hidden');}
}
function goHome(){
['listView','compatView','lessonsView'].forEach(i=>{let e=document.getElementById(i); if(e) e.classList.add('hidden');});
document.getElementById('homeView').classList.remove('hidden');
}
 function doSearch(){
let q=document.getElementById('search').value.toLowerCase().trim();
if(q.length<2){if(currentFilter==='all') renderCompatList(allCompat); return;}
let filtered=allCompat.filter(c=>c.part.toLowerCase().includes(q)||c.compat.toLowerCase().includes(q));
if(document.getElementById('homeView').classList.contains('hidden')===false){
document.getElementById('homeView').classList.add('hidden');
document.getElementById('compatView').classList.remove('hidden');
}
renderCompatList(filtered);
document.querySelectorAll('#viewGrid .phone-card').forEach(card=>{let n=card.innerText.toLowerCase(); card.style.display=n.includes(q)?'block':'none';});
}
renderHome();
</script>
<footer style="text-align:center;padding:25px;background:#000;margin-top:30px;border-top:1px solid #222">
<p>© 2026 فون فلكس Phone Flex - موسوعة التوافقات ${allCompat.length}+ توافق</p>
<p style="font-size:11px;color:#666;margin-top:5px">شاشات: ${screensDB.length+screensDB2.length} | بطاريات: ${batteriesDB.length+batteriesDB2.length} | قواعد شحن: ${chargeDB.length}</p>
</footer>
</body>
</html>
